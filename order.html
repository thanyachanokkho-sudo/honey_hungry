<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สั่งซื้อสินค้า | Honey Hungry</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Honey Hungry</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="product.html">สินค้า</a>
      </nav>
    </div>
  </header>

  <main>

    <section class="page-head">
      <div class="container text-center">
        <span class="eyebrow">Order</span>
        <h1>สั่งซื้อสินค้า</h1>
        <hr class="divider">
        <p class="lead">กรอกข้อมูลด้านล่าง ทางเราจะติดต่อกลับเพื่อยืนยันคำสั่งซื้อและแจ้งรายละเอียดการชำระเงิน</p>
      </div>
    </section>

    <section class="section section--products">
      <div class="container">
        <form id="orderForm" class="form-card" autocomplete="on">

          <div class="form-group">
            <label for="customerName">ชื่อลูกค้า</label>
            <input type="text" id="customerName" name="customerName" required autocomplete="name">
          </div>

          <div class="form-group">
            <label for="contact">เบอร์โทร / Line</label>
            <input type="text" id="contact" name="contact" required autocomplete="tel">
          </div>

          <div class="form-group">
            <label for="items">รายการสินค้า</label>
            <input type="text" id="items" name="items" required>
          </div>

          <div class="form-group">
            <label for="total">จำนวนเงินรวม (บาท)</label>
            <input type="text" id="total" name="total" inputmode="numeric" required>
          </div>

          <div class="form-group">
            <label for="note">หมายเหตุ <span class="optional">(ไม่บังคับ)</span></label>
            <textarea id="note" name="note" rows="4"></textarea>
          </div>

          <button type="submit" class="btn btn--block">ยืนยันสั่งซื้อ</button>

        </form>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="logo">Honey Hungry</div>
      <p>น้ำผึ้งแท้หลากรสในรูปแบบหลอดบีบ พกพาง่าย</p>
      <p>&copy; 2026 Honey Hungry. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
